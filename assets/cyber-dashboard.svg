    <circle cx="1028" cy="213" r="4" fill="#67ffae" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="962" cy="273" r="3.5" fill="#67ffae" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1011" cy="301" r="3" fill="#43bcff"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="994" cy="253" r="4" fill="#bcffd7" filter="url(#glow)"/>
  <text x="994" y="378" fill="#bdebd7" font-family="Consolas,Monaco,monospace" font-size="12" text-anchor="middle">VISUAL DEMO · NOT LIVE NETWORK DATA</text>
  <rect x="816" y="390" width="335" height="1" fill="#31ef91" fill-opacity=".3"/>
  <text x="817" y="408" fill="#56d996" font-family="Consolas,Monaco,monospace" font-size="11">RULE: TEST ONLY WITH EXPLICIT PERMISSION</text>
  <rect x="31" y="432" width="1138" height="24" rx="5" fill="#07110f" stroke="#2b9f69" stroke-opacity=".35"/>
  <g clip-path="url(#tickerClip)"><text y="449" fill="#5ee69b" font-family="Consolas,Monaco,monospace" font-size="12"><animate attributeName="x" values="1180;-700" dur="19s" repeatCount="indefinite"/>BUILD • LEARN • SECURE • SHARE • PYTHON • WEB • LINUX • OPEN SOURCE • RESPONSIBLE SECURITY • BUILD • LEARN • SECURE • SHARE</text></g>
