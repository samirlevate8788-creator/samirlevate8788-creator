    <circle cx="994" cy="253" r="51" fill="none" stroke="#41dc8d" stroke-opacity=".32"/>
    <circle cx="994" cy="253" r="24" fill="none" stroke="#41dc8d" stroke-opacity=".36"/>
    <path d="M994 253L994 148A105 105 0 0 1 1070 181Z" fill="#30f58b" fill-opacity=".11"/>
